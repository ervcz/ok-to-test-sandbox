name: ok-to-test
on:
  issue_comment:
    types: [created]
permissions:
  actions: write
  pull-requests: read
jobs:
  approve:
    if: github.event.issue.pull_request && github.event.comment.body == '/ok-to-test'
    runs-on: ubuntu-24.04
    steps:
    - env:
        GH_TOKEN: ${{ github.token }}
        REPO: ${{ github.repository }}
        PR: ${{ github.event.issue.number }}
        COMMENTER: ${{ github.event.comment.user.login }}
      run: |
        gh api "repos/$REPO/collaborators/$COMMENTER/permission" --jq '"role_name=\(.role_name) permission=\(.permission)"'
        sha=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
        ids=$(gh api "repos/$REPO/actions/runs?head_sha=$sha" \
          --jq '.workflow_runs[] | select(.status == "action_required" or .status == "waiting" or .conclusion == "action_required") | .id')
        echo "Waiting runs for $sha: ${ids:-none}"
        for id in $ids; do
          gh api -X POST -i "repos/$REPO/actions/runs/$id/approve" || true
        done
